<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deloo Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- App UI fonts (design.html v0.2) + poster style fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@200..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500&family=Archivo:wdth,wght@62..125,100..900&family=Anton&family=Space+Mono:wght@400;700&family=Yellowtail&family=Mrs+Saint+Delafield&family=Instrument+Serif&family=Inter+Tight:wght@500..800&family=Caveat:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
<style>
/* =====================================================================
   APP TOKENS (mirror design.html v0.2)
   ===================================================================== */
:root {
  --paper: #F3F5F4; --surface: #FFFFFF; --ink: #12161C; --slate: #4A5560; --line: #D3DADB;
  --lagoon: #0F6B73; --lagoon-strong: #0B5359; --lagoon-tint: #E0EFEF; --on-lagoon: #FFFFFF;
  --marigold: #F2A900; --marigold-strong: #D99700; --on-marigold: #12161C;
  --proof-red: #C23A2E; --proof-red-tint: #FBEAE7; --approve: #1F8A5B;
  --font-display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 5px;
  --ring: 2px solid color-mix(in srgb, var(--marigold) 70%, transparent);
  --control-h: 38px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1215; --surface: #161B20; --ink: #E7ECEE; --slate: #9AA7B0; --line: #2A333A;
    --lagoon: #3AAAB2; --lagoon-strong: #5CC3CA; --lagoon-tint: #12292C; --on-lagoon: #081214;
    --marigold: #F5B82E; --marigold-strong: #FFC94D; --on-marigold: #12161C;
    --proof-red: #EE6A5C; --proof-red-tint: #2E1714; --approve: #4CC08A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1215; --surface: #161B20; --ink: #E7ECEE; --slate: #9AA7B0; --line: #2A333A;
  --lagoon: #3AAAB2; --lagoon-strong: #5CC3CA; --lagoon-tint: #12292C; --on-lagoon: #081214;
  --marigold: #F5B82E; --marigold-strong: #FFC94D; --on-marigold: #12161C;
  --proof-red: #EE6A5C; --proof-red-tint: #2E1714; --approve: #4CC08A;
  color-scheme: dark;
}
@media (pointer: coarse) { :root { --control-h: 44px; } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 15px/1.55 var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Shared controls ---------- */
.btn {
  --bg: var(--lagoon); --fg: var(--on-lagoon); --bd: var(--lagoon);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
  font: 500 14px/1 var(--font-body); padding: 9px 14px; min-height: var(--control-h);
  color: var(--fg); background: var(--bg); border: 1px solid var(--bd); border-radius: var(--radius);
  cursor: pointer; transition: background-color .15s, border-color .15s, opacity .15s;
}
.btn:hover { --bg: var(--lagoon-strong); --bd: var(--lagoon-strong); }
.btn:focus-visible { outline: var(--ring); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn-generate { --bg: var(--marigold); --fg: var(--on-marigold); --bd: var(--marigold); }
.btn-generate:hover { --bg: var(--marigold-strong); --bd: var(--marigold-strong); }
.btn-generate:focus-visible { outline: 2px solid color-mix(in srgb, var(--ink) 45%, transparent); }
.btn-secondary { --bg: transparent; --fg: var(--ink); --bd: var(--line); }
.btn-secondary:hover { --bg: var(--paper); --bd: var(--ink); }
.btn-quiet { --bg: transparent; --fg: var(--lagoon); --bd: transparent; padding-inline: 8px; }
.btn-quiet:hover { --bg: var(--lagoon-tint); --bd: var(--lagoon-tint); }
.btn-sm { min-height: 30px; padding: 6px 10px; font-size: 12px; }
.field { display: grid; gap: 5px; }
.field-label { font: 500 13px var(--font-body); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.field-label .opt { font: 400 11px var(--font-mono); color: var(--slate); }
.control {
  font: 400 14px/1.4 var(--font-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; min-height: var(--control-h); width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
textarea.control { resize: vertical; min-height: 64px; }
.control:hover { border-color: color-mix(in srgb, var(--ink) 45%, var(--line)); }
.control:focus { outline: none; border-color: var(--lagoon); box-shadow: 0 0 0 2px color-mix(in srgb, var(--lagoon) 18%, transparent); }
.control[aria-invalid="true"] { border-color: var(--proof-red); background: var(--proof-red-tint); }
.hint { font-size: 12px; color: var(--slate); margin: 0; }
.error { font-size: 12px; color: var(--proof-red); margin: 0; font-weight: 500; }
.badge { font: 400 11px/1 var(--font-mono); padding: 5px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--slate); white-space: nowrap; }
.badge.warm { border-color: color-mix(in srgb, var(--marigold) 60%, transparent); color: var(--ink); background: color-mix(in srgb, var(--marigold) 14%, transparent); }
.spinner { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 32px; height: 18px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex-shrink: 0; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + .track { background: var(--lagoon); }
.switch input:checked + .track::after { transform: translateX(14px); }
.switch input:focus-visible + .track { outline: var(--ring); outline-offset: 2px; }

/* =====================================================================
   ONBOARDING
   ===================================================================== */
.onboarding { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.ob-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-inline: clamp(16px, 4vw, 40px); padding-block: 18px; }
.wordmark { font: 600 24px/1 var(--font-display); letter-spacing: -0.03em; margin: 0; }
.wordmark .dot { color: var(--marigold); }
.ob-progress { display: flex; align-items: center; gap: 10px; font: 400 11px var(--font-mono); color: var(--slate); }
.ob-bar { width: 120px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.ob-bar i { display: block; height: 100%; background: var(--lagoon); transition: width .35s ease; }
.ob-main { display: grid; justify-items: center; align-content: start; padding-inline: clamp(16px, 4vw, 40px); padding-block: clamp(16px, 5vh, 56px) 56px; }
.ob-step { width: 100%; max-width: 640px; display: grid; gap: 22px; animation: rise .35s ease both; }
.ob-step.wide { max-width: 1040px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.ob-kicker { font: 400 11px var(--font-mono); color: var(--slate); text-transform: uppercase; letter-spacing: .08em; margin: 0; }
.ob-step h1 { font: 500 clamp(26px, 4vw, 34px)/1.12 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.ob-step h1:focus, .setup-screen h1:focus { outline: none; }
.ob-lead { margin: 0; color: var(--slate); max-width: 58ch; }
.ob-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.ob-actions .spacer { flex: 1; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.choice {
  position: relative; display: grid; gap: 4px; align-content: start; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; cursor: pointer;
  transition: border-color .15s, background .15s;
}
.choice:hover { border-color: color-mix(in srgb, var(--ink) 40%, var(--line)); }
.choice[aria-pressed="true"], .choice[aria-checked="true"] { border-color: var(--lagoon); background: var(--lagoon-tint); }
.choice:focus-visible { outline: var(--ring); outline-offset: 2px; }
.choice .c-title { font-weight: 500; font-size: 14px; padding-right: 22px; }
.choice .c-desc { font-size: 12px; color: var(--slate); line-height: 1.4; }
.choice .tick { position: absolute; top: 10px; right: 10px; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 11px; color: transparent; background: var(--surface); z-index: 2; }
.choice[aria-pressed="true"] .tick, .choice[aria-checked="true"] .tick { background: var(--lagoon); border-color: var(--lagoon); color: var(--on-lagoon); }
.choice.soon { cursor: default; opacity: .62; background: transparent; border-style: dashed; }
.choice.soon:hover { border-color: var(--line); }
.tag { justify-self: start; font: 400 10px/1 var(--font-mono); padding: 4px 6px; border-radius: 99px; background: var(--paper); border: 1px solid var(--line); color: var(--slate); text-transform: uppercase; letter-spacing: .04em; }
.tag.req { border-color: color-mix(in srgb, var(--marigold) 60%, transparent); background: color-mix(in srgb, var(--marigold) 14%, transparent); color: var(--ink); }
.subhead { font: 500 13px var(--font-body); margin: 6px 0 -8px; color: var(--slate); }
.request-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.request-list { display: flex; flex-wrap: wrap; gap: 8px; }
.style-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .style-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.style-card { padding: 10px; gap: 8px; }
.style-card .thumb { border-radius: 4px; overflow: hidden; }
.style-card .c-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-right: 0; }
.style-card .c-title small { font: 400 10px var(--font-mono); color: var(--slate); }
.setup-screen { min-height: 50vh; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; }
.setup-screen p { margin: 0; color: var(--slate); }

/* =====================================================================
   DASHBOARD
   ===================================================================== */
.dash { min-height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px;
  padding-inline: clamp(16px, 2.5vw, 28px); padding-block: 12px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.topbar .left { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.topbar .org { font-size: 13px; color: var(--slate); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.proto-menu { position: relative; }
.proto-menu summary { list-style: none; cursor: pointer; }
.proto-menu summary::-webkit-details-marker { display: none; }
.proto-menu .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12); display: grid; }
.proto-menu .menu button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.proto-menu .menu button:hover, .proto-menu .menu button:focus-visible { background: var(--paper); outline: none; }
.proto-menu .menu small { display: block; padding: 6px 10px 2px; font: 400 10px var(--font-mono); color: var(--slate); text-transform: uppercase; letter-spacing: .06em; }
.workspace { display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; gap: 16px; padding: 16px clamp(16px, 2.5vw, 28px) 24px; align-items: start; }
.rail, .chat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.rail { padding: 16px; display: grid; gap: 18px; align-content: start; }
.rail h2, .chat h2 { font: 500 16px/1.2 var(--font-display); margin: 0; }
.rail section { display: grid; gap: 10px; }
.rail .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rail .sec-head span { font: 400 11px var(--font-mono); color: var(--slate); }
.dropzone {
  display: grid; place-items: center; gap: 6px; text-align: center; min-height: 104px; padding: 12px;
  border: 1px dashed color-mix(in srgb, var(--ink) 30%, var(--line)); border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--slate);
  transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.drag { border-color: var(--lagoon); background: var(--lagoon-tint); color: var(--ink); }
.dropzone:focus-visible { outline: var(--ring); outline-offset: 2px; }
.dropzone img { max-height: 64px; max-width: 100%; }
.dropzone span { display: grid; gap: 4px; justify-items: center; }
.dropzone b { color: var(--ink); font-weight: 500; }
.pulse { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--marigold) 45%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--marigold) 0%, transparent); } }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.swatch { display: grid; gap: 4px; justify-items: center; font: 400 10px var(--font-mono); color: var(--slate); }
.swatch input[type="color"] { width: 100%; height: 34px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.swatch input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
.swatch input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 2px; }
.swatch input[type="color"]:focus-visible { outline: var(--ring); outline-offset: 2px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { display: inline-flex; align-items: center; padding: 3px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); cursor: pointer; }
.preset i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.preset i + i { margin-left: -4px; }
.preset:hover { border-color: var(--ink); }
.preset:focus-visible { outline: var(--ring); outline-offset: 2px; }
.locked-note { display: flex; gap: 8px; font-size: 12px; color: var(--slate); background: var(--paper); border-radius: var(--radius); padding: 8px 10px; margin: 0; }

.canvas { display: grid; grid-template-rows: auto auto auto; gap: 12px; min-width: 0; }
.canvas-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; min-height: 38px; }
.canvas-head h2 { font: 500 18px/1.2 var(--font-display); margin: 0; }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 6px 10px; border-radius: 5px; font-size: 13px; color: var(--slate); cursor: pointer; white-space: nowrap; }
.tab small { font: 400 10px var(--font-mono); margin-left: 5px; opacity: .85; }
.tab[aria-selected="true"] { background: var(--lagoon-tint); color: var(--ink); font-weight: 500; }
.tab:focus-visible { outline: var(--ring); outline-offset: 1px; }
.tab-rows { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.artboard {
  position: relative; min-height: 440px; border-radius: 10px; display: grid; place-items: center; padding: 20px;
  background: radial-gradient(color-mix(in srgb, var(--ink) 12%, transparent) 1px, transparent 1.4px) 0 0 / 18px 18px, color-mix(in srgb, var(--paper) 60%, var(--surface));
  border: 1px solid var(--line); overflow: hidden;
}
.empty-canvas { width: min(100%, 560px); display: grid; gap: 14px; }
.empty-canvas .blank {
  aspect-ratio: 1; width: min(100%, 36vh, 340px); margin-inline: auto;
  background: var(--surface); border: 1.5px dashed color-mix(in srgb, var(--ink) 25%, var(--line)); border-radius: 6px;
  display: grid; place-items: center; color: var(--slate); font-size: 13px; text-align: center; padding: 20px;
}
.pointers { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.pointer { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; transition: border-color .2s, opacity .2s, box-shadow .2s; }
.pointer .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 500 12px var(--font-mono); border: 1px solid var(--line); color: var(--slate); }
.pointer.current { border-color: var(--marigold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--marigold) 18%, transparent); }
.pointer.current .num { background: var(--marigold); border-color: var(--marigold); color: var(--on-marigold); }
.pointer.done .num { background: var(--approve); border-color: var(--approve); color: #fff; }
.pointer.done { opacity: .72; }
.pointer b { font-weight: 500; font-size: 14px; display: block; }
.pointer .sub { font-size: 12px; color: var(--slate); }
.pointer .dir { font-size: 18px; color: var(--slate); display: flex; gap: 6px; align-items: center; }
.type-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 400 13px/1.2 var(--font-body); padding: 6px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; color: var(--ink); }
.chip:hover { border-color: var(--lagoon); background: var(--lagoon-tint); }
.chip:focus-visible { outline: var(--ring); outline-offset: 2px; }
.chip[aria-pressed="true"] { border-color: var(--lagoon); background: var(--lagoon-tint); font-weight: 500; }
.chip:disabled { opacity: .5; cursor: default; }
.chip:disabled[aria-pressed="true"] { opacity: .9; }
.frame { position: relative; overflow: hidden; border-radius: 3px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-width: 100%; }
.frame > .poster { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.gen-pill {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 5;
  display: inline-flex; align-items: center; gap: 8px; font: 400 12px var(--font-mono);
  background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 99px; padding: 7px 12px; color: var(--ink);
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
}
.canvas-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
.canvas-foot .meta { font: 400 11px var(--font-mono); color: var(--slate); }
.canvas-foot .acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Blur to sharp */
.developing .tpl { animation: develop 1.9s cubic-bezier(.2,.7,.2,1) both; }
.developing.quick .tpl { animation-duration: .7s; }
@keyframes develop {
  0% { filter: blur(34px) saturate(.15) brightness(1.15); transform: scale(1.06); }
  45% { filter: blur(14px) saturate(.6) brightness(1.06); }
  100% { filter: none; transform: none; }
}

.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: calc(100vh - 98px); min-height: 520px; position: sticky; top: 12px; }
.chat-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-log { overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 94%; display: grid; gap: 8px; animation: rise .25s ease both; }
.msg .bubble { padding: 9px 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
.msg.bot { align-self: flex-start; }
.msg.bot .bubble { background: var(--paper); border-top-left-radius: 4px; }
.msg.user { align-self: flex-end; }
.msg.user .bubble { background: var(--lagoon); color: var(--on-lagoon); border-top-right-radius: 4px; }
.msg .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.typing { display: inline-flex; gap: 4px; padding: 12px; background: var(--paper); border-radius: 12px; border-top-left-radius: 4px; align-self: flex-start; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--slate); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.card-form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 10px; }
.found { font: 400 10px var(--font-mono); padding: 2px 6px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.found.yes { color: var(--approve); background: color-mix(in srgb, var(--approve) 12%, transparent); }
.found.no { color: var(--slate); background: var(--paper); }
.mini-swatches { display: inline-flex; gap: 4px; vertical-align: middle; margin-inline: 2px; }
.mini-swatches i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid color-mix(in srgb, var(--ink) 15%, transparent); display: inline-block; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 16px 14px; border-top: 1px solid var(--line); align-items: end; }
.composer textarea { min-height: 42px; max-height: 140px; resize: none; }
.composer .hint { grid-column: 1 / -1; }

.gallery { padding: 24px; display: grid; gap: 28px; }
.gallery h2 { font: 500 18px var(--font-display); margin: 0 0 10px; }
.gallery .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
.gallery .row .frame { box-shadow: none; outline: 1px solid var(--line); }

@media (max-width: 1180px) {
  .workspace { grid-template-columns: minmax(0, 1fr) 340px; }
  .rail { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); order: 3; }
}
@media (max-width: 860px) {
  .workspace { grid-template-columns: 1fr; }
  .chat { position: static; height: 70vh; }
  .control { font-size: 16px; }
  .pointer .dir { font-size: 14px; }
  .gallery .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* =====================================================================
   POSTERS
   Rendered at real pixel size, scaled for preview.
   Style = layout + type (fixed). Brand = colours + logo (from the kit).
   Colours come only from palette variables set per poster.
   ===================================================================== */
.poster {
  container-type: size; position: relative; overflow: hidden;
  --f-cond: "Anton", Impact, "Arial Narrow", sans-serif;
  --f-wide: "Archivo", "Arial Black", Arial, sans-serif;
  --f-mono: "Space Mono", "Courier New", monospace;
  --f-script: "Yellowtail", "Brush Script MT", cursive;
  --f-sign: "Mrs Saint Delafield", "Brush Script MT", cursive;
  --f-serif: "Instrument Serif", Georgia, serif;
  --f-grot: "Inter Tight", Arial, sans-serif;
  --f-hand: "Caveat", "Comic Sans MS", cursive;
}
.tpl { position: relative; width: 100%; height: 100%; overflow: hidden; --hs: 1; --ts: 1; }
.tpl * { margin: 0; }
.tpl .box { position: relative; }
.tpl .box > * { flex-shrink: 0; }
.tpl .grain { position: absolute; inset: 0; pointer-events: none; z-index: 10; opacity: .55; }
.tpl .logo-img { display: block; object-fit: contain; }
.tpl .logo-text { font-family: var(--f-mono); font-weight: 700; text-transform: uppercase; letter-spacing: .12em; }

/* ---------- 1. BADGE ---------- */
.st-badge { background: var(--p); color: var(--on-p); font-family: var(--f-wide); text-transform: uppercase; }
.st-badge > .box { height: 100%; padding: 6cqmin 6.5cqmin; display: flex; flex-direction: column; align-items: center; gap: 2.6cqmin; text-align: center; }
.st-badge .b-row { width: 100%; display: flex; justify-content: space-between; gap: 4cqmin; font-weight: 800; font-size: calc(3.5cqmin * var(--ts)); line-height: 1.1; }
.st-badge .b-row span:last-child { text-align: right; }
.st-badge .b-date { font-weight: 900; font-stretch: 112%; font-size: calc(8.5cqmin * var(--ts)); line-height: 1; letter-spacing: -.01em; }
.st-badge .b-oval { width: 100%; flex: 1 1 auto; min-height: 22cqmin; max-height: 50cqmin; display: grid; place-items: center; border: 1.1cqmin solid currentColor; border-radius: 50%; padding: 4cqmin 8cqmin; flex-shrink: 1; }
.st-badge .hl { font-weight: 900; font-stretch: 125%; font-size: calc(14cqmin * var(--hs)); line-height: .9; letter-spacing: -.035em; }
.st-badge.is-quote .hl { font-stretch: 100%; text-transform: none; line-height: 1; }
.st-badge .b-sub { font-weight: 800; font-stretch: 125%; font-size: calc(4.2cqmin * var(--ts)); line-height: 1.1; max-width: 92%; }
.st-badge .b-with { font-weight: 700; font-size: calc(2.6cqmin * var(--ts)); letter-spacing: .8em; margin-right: -.8em; }
.st-badge .b-names { font-family: var(--f-cond); font-size: calc(7cqmin * var(--ts)); line-height: 1; }
.st-badge .b-body { font-family: var(--f-grot); text-transform: none; font-weight: 500; font-size: calc(3.3cqmin * var(--ts)); line-height: 1.35; max-width: 84%; }
.st-badge .b-row.foot { margin-top: auto; font-size: calc(3cqmin * var(--ts)); }
.st-badge.sz-story > .box { padding-block: 12cqmin 10cqmin; gap: 4cqmin; }
.st-badge.sz-story .b-oval { max-height: 44cqmin; }
.st-badge.sz-banner > .box { display: grid; grid-template-columns: 1.25fr 1fr; grid-auto-rows: auto; align-content: center; column-gap: 8cqmin; row-gap: 2.4cqmin; padding: 8cqmin 10cqmin; text-align: left; justify-items: start; }
.st-badge.sz-banner > .box > * { grid-column: 2; }
.st-badge.sz-banner .b-oval { grid-column: 1; grid-row: 1 / span 9; height: 100%; max-height: none; align-self: stretch; }
.st-badge.sz-banner .hl { font-size: calc(24cqmin * var(--hs)); }
.st-badge.sz-banner .b-row { font-size: calc(5.4cqmin * var(--ts)); }
.st-badge.sz-banner .b-row.foot { font-size: calc(4.6cqmin * var(--ts)); margin-top: 2cqmin; }
.st-badge.sz-banner .b-date { font-size: calc(13cqmin * var(--ts)); }
.st-badge.sz-banner .b-sub { font-size: calc(6.4cqmin * var(--ts)); }
.st-badge.sz-banner .b-names { font-size: calc(11cqmin * var(--ts)); }
.st-badge.sz-banner .b-with { font-size: calc(4cqmin * var(--ts)); }
.st-badge.sz-banner .b-body { font-size: calc(5cqmin * var(--ts)); }

/* ---------- 2. RECEIPT ---------- */
.st-receipt { background: var(--p); }
.st-receipt .stage { height: 100%; display: flex; justify-content: center; align-items: stretch; padding: 6cqmin; }

  padding: 5.5cqmin 5cqmin 4cqmin; display: flex; flex-direction: column; gap: 2.4cqmin; box-shadow: 0 1.5cqmin 4cqmin rgba(0,0,0,.28);
}
.st-receipt .r-a, .st-receipt .r-b { display: flex; flex-direction: column; gap: 2cqmin; }
.st-receipt .r-b { flex: 1 1 auto; }
.st-receipt .r-top { display: flex; justify-content: space-between; gap: 2cqmin; font-size: calc(2.6cqmin * var(--ts)); font-weight: 700; text-transform: uppercase; }
.st-receipt .r-top .k { color: var(--on-pp); font-family: var(--f-wide); font-stretch: 112%; letter-spacing: .06em; }
.st-receipt .r-logo { display: flex; justify-content: center; }
.st-receipt .r-logo .logo-img { height: 7cqmin; }
.st-receipt .r-logo .logo-text { font-size: 2.4cqmin; }
.st-receipt .hl { font-family: var(--f-script); color: var(--on-pp); font-size: calc(10cqmin * var(--hs)); line-height: 1.05; text-align: center; }

.st-receipt .r-row { display: flex; align-items: baseline; gap: 1cqmin; font-size: calc(2.8cqmin * var(--ts)); line-height: 1.35; }
.st-receipt .r-row i { flex: 1 1 auto; border-bottom: .35cqmin dotted var(--k); min-width: 3cqmin; transform: translateY(-.6cqmin); }
.st-receipt .r-row .v { text-align: right; max-width: 62%; }
.st-receipt .r-body { font-size: calc(2.6cqmin * var(--ts)); line-height: 1.45; }
.st-receipt .r-bar { height: 7cqmin; margin-inline: 3cqmin; margin-top: auto; background: repeating-linear-gradient(90deg, var(--k) 0 .45cqmin, transparent .45cqmin .9cqmin, var(--k) .9cqmin 1.6cqmin, transparent 1.6cqmin 2.1cqmin, var(--k) 2.1cqmin 2.35cqmin, transparent 2.35cqmin 3cqmin); }
.st-receipt .r-sign { font-family: var(--f-script); color: var(--on-pp); font-size: calc(7.5cqmin * var(--ts)); text-align: center; line-height: 1.05; }
.st-receipt .r-foot { display: flex; justify-content: space-between; gap: 2cqmin; font-size: calc(2.2cqmin * var(--ts)); text-transform: uppercase; }
.st-receipt.sz-story .r-paper { width: 78%; height: 86%; }
.st-receipt.sz-a5 .r-paper { width: 76%; }
.st-receipt.sz-banner .r-paper { width: 90%; flex-direction: row; gap: 8cqmin; padding: 6cqmin 8cqmin; }
.st-receipt.sz-banner .r-a { flex: 1; justify-content: center; }
.st-receipt.sz-banner .r-b { flex: 1.15; }
.st-receipt.sz-banner .hl { font-size: calc(17cqmin * var(--hs)); }
.st-receipt.sz-banner .r-top { font-size: calc(4cqmin * var(--ts)); }
.st-receipt.sz-banner .r-sub, .st-receipt.sz-banner .r-body { font-size: calc(4cqmin * var(--ts)); }
.st-receipt.sz-banner .r-row { font-size: calc(4.4cqmin * var(--ts)); }
.st-receipt.sz-banner .r-sign { font-size: calc(10cqmin * var(--ts)); }
.st-receipt.sz-banner .r-foot { font-size: calc(3.4cqmin * var(--ts)); }
.st-receipt.sz-banner .r-logo .logo-img { height: 11cqmin; }
.st-receipt.sz-banner .r-bar { height: 9cqmin; }

/* ---------- 3. TICKET ROLL ---------- */
.st-ticket { background: var(--p); color: var(--on-p-body); }
.st-ticket > .box { height: 100%; display: grid; grid-template-columns: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto; grid-template-areas: "big" "slot" "paper" "org"; justify-items: center; padding: 6cqmin 7cqmin 4.5cqmin; }
.st-ticket .t-big { grid-area: big; font-family: var(--f-cond); text-transform: uppercase; font-size: calc(15cqmin * var(--hs)); line-height: .9; text-align: center; margin-bottom: 4cqmin; max-width: 100%; }
.st-ticket .t-slot { grid-area: slot; width: 100%; height: 6.5cqmin; border-radius: 1.6cqmin; background: linear-gradient(#ececec, #a1a1a1 55%, #d2d2d2); box-shadow: 0 1cqmin 2cqmin rgba(0,0,0,.3), inset 0 -1.2cqmin 0 #6f6f6f; position: relative; z-index: 2; }
.st-ticket .t-slot i { position: absolute; left: 6%; right: 6%; top: 42%; height: .9cqmin; background: #333; border-radius: 1cqmin; }
.st-ticket .t-paper {
  grid-area: paper; width: 84%; height: 100%; margin-top: -2.4cqmin; background: var(--pp-light); color: var(--k);
  padding: 6cqmin 5cqmin 7cqmin; display: flex; flex-direction: column; align-items: center; gap: 2.2cqmin; text-align: center;
  clip-path: var(--zig); font-family: var(--f-mono); box-shadow: inset 0 3cqmin 3cqmin -2cqmin rgba(0,0,0,.25);
}
.st-ticket .t-kick { font-family: var(--f-wide); font-weight: 800; font-stretch: 112%; letter-spacing: .28em; text-transform: uppercase; font-size: calc(3.4cqmin * var(--ts)); line-height: 1.2; }
.st-ticket .t-block { width: 100%; background: var(--p); color: var(--on-p-body); padding: 3cqmin 2cqmin; font-family: var(--f-cond); text-transform: uppercase; font-size: calc(8.5cqmin * var(--hs)); line-height: .92; }
.st-ticket.is-quote .t-block { text-transform: none; }
.st-ticket .t-rule { width: 80%; border-top: .4cqmin solid var(--k); }
.st-ticket .t-line { font-weight: 700; text-transform: uppercase; font-size: calc(3.4cqmin * var(--ts)); line-height: 1.25; }
.st-ticket .t-date { font-size: calc(4cqmin * var(--ts)); text-transform: uppercase; }
.st-ticket .t-bar { width: 90%; height: 8cqmin; margin-top: auto; background: repeating-linear-gradient(90deg, var(--k) 0 .45cqmin, transparent .45cqmin .9cqmin, var(--k) .9cqmin 1.6cqmin, transparent 1.6cqmin 2.1cqmin, var(--k) 2.1cqmin 2.35cqmin, transparent 2.35cqmin 3cqmin); }
.st-ticket .t-sign { font-family: var(--f-wide); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: calc(3.2cqmin * var(--ts)); line-height: 1.15; }
.st-ticket .t-org { grid-area: org; margin-top: 3cqmin; display: flex; align-items: center; gap: 2cqmin; font-family: var(--f-mono); font-weight: 700; text-decoration: underline; text-underline-offset: .8cqmin; text-transform: uppercase; font-size: calc(3.4cqmin * var(--ts)); letter-spacing: .05em; }
.st-ticket .t-org .logo-img { height: 6cqmin; }
.st-ticket.sz-story > .box { padding-block: 12cqmin 8cqmin; }
.st-ticket.sz-banner > .box { grid-template-columns: 1fr 1.15fr; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "big slot" "big paper" "org paper"; column-gap: 8cqmin; padding: 6cqmin 9cqmin; justify-items: stretch; }
.st-ticket.sz-banner .t-big { align-self: center; text-align: left; font-size: calc(22cqmin * var(--hs)); margin: 0; }
.st-ticket.sz-banner .t-org { justify-self: start; font-size: calc(4.6cqmin * var(--ts)); }
.st-ticket.sz-banner .t-paper { justify-self: center; width: 88%; padding: 6cqmin 6cqmin 7cqmin; }
.st-ticket.sz-banner .t-slot { height: 8cqmin; }
.st-ticket.sz-banner .t-kick { font-size: calc(4.6cqmin * var(--ts)); }
.st-ticket.sz-banner .t-block { font-size: calc(12cqmin * var(--hs)); }
.st-ticket.sz-banner .t-line, .st-ticket.sz-banner .t-sign { font-size: calc(4.6cqmin * var(--ts)); }
.st-ticket.sz-banner .t-date { font-size: calc(5.4cqmin * var(--ts)); }

/* ---------- 4. FORM CARD ---------- */
.st-form { background: var(--pp); color: var(--k); }
.st-form .f-giant { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--f-cond); color: var(--on-pp); text-transform: uppercase; line-height: .8; white-space: nowrap; z-index: 0; }
.st-form .f-top { top: -2.5cqmin; }
.st-form .f-bot { bottom: -4.5cqmin; }
.st-form .f-script { position: absolute; font-family: var(--f-sign); color: var(--on-pp-script); font-size: 17cqmin; transform: rotate(-8deg); white-space: nowrap; line-height: 1.2; z-index: 3; pointer-events: none; }
.st-form .f-s1 { top: 3cqmin; left: 18%; }
.st-form .f-s2 { bottom: 3cqmin; left: 34%; }
.st-form .f-card {
  position: absolute; left: 12%; right: 12%; top: 23%; bottom: 20%; transform: rotate(-2.2deg); z-index: 2;
  background: var(--pp-light); border: .25cqmin solid var(--k); padding: 5.5cqmin 6cqmin 4.5cqmin;
  display: flex; flex-direction: column; gap: 2.2cqmin; font-family: var(--f-mono); box-shadow: 0 1cqmin 3cqmin rgba(0,0,0,.12);
}
.st-form .f-intro { text-align: center; text-transform: uppercase; font-size: calc(4cqmin * var(--hs)); line-height: 1.25; margin-bottom: 1.5cqmin; }

.st-form .f-field { display: grid; gap: 1cqmin; }
.st-form .f-tab { justify-self: start; background: var(--p); color: var(--on-p-body); font-family: var(--f-wide); font-weight: 800; font-stretch: 105%; text-transform: uppercase; font-size: calc(3cqmin * var(--ts)); padding: .9cqmin 2.2cqmin; }
.st-form .f-val { border-top: .25cqmin solid var(--k); padding-top: 1.2cqmin; font-size: calc(4.2cqmin * var(--ts)); text-transform: uppercase; line-height: 1.15; }
.st-form .f-field.first .f-val { font-size: calc(6.6cqmin * var(--ts)); }
.st-form .f-foot { margin-top: auto; text-align: center; text-transform: uppercase; font-size: calc(2.8cqmin * var(--ts)); }
.st-form .f-body { text-align: center; font-size: calc(2.8cqmin * var(--ts)); line-height: 1.4; }
.st-form .f-logo { position: absolute; right: 4cqmin; bottom: 3cqmin; z-index: 4; }
.st-form .f-logo .logo-img { height: 6cqmin; }
.st-form .f-logo .logo-text { font-size: 2cqmin; color: var(--k); background: var(--pp-light); padding: .6cqmin 1cqmin; }
.st-form.sz-square .f-card { top: 17%; bottom: 13%; left: 10%; right: 10%; }
.st-form.sz-story .f-card { top: 20%; bottom: 17%; }
.st-form.sz-story .f-script { font-size: 20cqmin; }
.st-form.sz-banner .f-card { left: 48%; right: 5%; top: 9%; bottom: 9%; transform: rotate(-1.4deg); padding: 5cqmin 7cqmin; }
.st-form.sz-banner .f-giant { left: 4%; transform: none; }
.st-form.sz-banner .f-top { top: -4cqmin; }
.st-form.sz-banner .f-bot { bottom: -8cqmin; }
.st-form.sz-banner .f-s1 { top: 10cqmin; left: 8%; font-size: 24cqmin; }
.st-form.sz-banner .f-s2 { bottom: 6cqmin; left: 20%; font-size: 22cqmin; }
.st-form.sz-banner .f-intro { font-size: calc(6cqmin * var(--hs)); }
.st-form.sz-banner .f-subline, .st-form.sz-banner .f-body { font-size: calc(4.2cqmin * var(--ts)); }
.st-form.sz-banner .f-tab { font-size: calc(4.4cqmin * var(--ts)); }
.st-form.sz-banner .f-val { font-size: calc(5.6cqmin * var(--ts)); }
.st-form.sz-banner .f-field.first .f-val { font-size: calc(8.5cqmin * var(--ts)); }
.st-form.sz-banner .f-foot { font-size: calc(4.2cqmin * var(--ts)); }
.st-form.sz-banner .f-logo { right: auto; left: 4%; bottom: 40%; }
.st-form.sz-banner .f-logo .logo-img { height: 12cqmin; }

/* ---------- 5. EDITORIAL SERIF ---------- */
.st-editorial { background: var(--pp); }
.st-editorial .e-frame { height: 100%; padding: 6cqmin; }
.st-editorial .e-panel { height: 100%; background: var(--p); color: var(--on-p-body); padding: 5cqmin 6cqmin; display: flex; flex-direction: column; gap: 3cqmin; font-family: var(--f-serif); text-transform: uppercase; }

.st-editorial .e-b { margin-top: auto; }
.st-editorial .e-kick { font-family: var(--f-mono); font-size: calc(2.4cqmin * var(--ts)); letter-spacing: .2em; text-align: center; }
.st-editorial .hl { font-size: calc(12cqmin * var(--hs)); line-height: .92; text-align: center; letter-spacing: -.01em; font-weight: 400; }
.st-editorial.is-quote .hl { text-transform: none; line-height: 1; }
.st-editorial .e-sub { font-size: calc(4.8cqmin * var(--ts)); line-height: .98; max-width: 72%; }

.st-editorial .e-org .logo-text { font-size: 1.9cqmin; }
.st-editorial.sz-story .e-panel { padding-block: 10cqmin 8cqmin; }
.st-editorial.sz-banner .e-frame { padding: 4.5cqmin; }

.st-editorial.sz-banner .e-sub { font-size: calc(6.4cqmin * var(--ts)); max-width: none; }
.st-editorial.sz-banner .e-body { font-size: calc(5.6cqmin * var(--ts)); margin-left: 0; text-align: left; }
.st-editorial.sz-banner .e-date { font-size: calc(20cqmin * var(--ts)); text-align: left; }
.st-editorial.sz-banner .e-meta { text-align: left; font-size: calc(4.8cqmin * var(--ts)); }
.st-editorial.sz-banner .e-org { font-size: 2.6cqmin; bottom: .8cqmin; }

/* ---------- 6. PINNED NOTE ---------- */
.st-note { background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 64%, var(--ground) 64%, var(--ground-2) 100%); }

  fitPoster(el.firstChild, size);
}

  $$("[data-giant]", tpl).forEach(function (g) {
    var len = Math.max(3, g.getAttribute("data-giant").length), avail = size.key === "banner" ? 128 : 104;
    g.style.fontSize = Math.min(size.key === "banner" ? 44 : 36, avail / (len * .5)) + "cqmin";
  });

  /* Layout offsets ignore transforms, so rotated cards measure true. Text must stay clear of the bottom padding. */

    for (var j = 0; j < hls.length; j++) { if (hls[j].scrollWidth > hls[j].clientWidth + 2) return true; }
    return false;
  }
  tpl.style.setProperty("--hs", 1); tpl.style.setProperty("--ts", 1);
  while (over() && n < 45) {
    if (hs > .42) hs *= .93; else ts *= .93;

}

/* Downloads: the image library can't read the Google Fonts stylesheet from
   a local file, so fetch the poster fonts once and embed them (Latin subset). */
var POSTER_FONTS_URL = "https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Anton&family=Space+Mono:wght@400;700&family=Yellowtail&family=Mrs+Saint+Delafield&family=Instrument+Serif&family=Inter+Tight:wght@500..800&family=Caveat:wght@600;700&display=swap";
var fontEmbed = null;
function getFontEmbedCSS() {
  if (fontEmbed) return fontEmbed;
  fontEmbed = fetch(POSTER_FONTS_URL).then(function (r) { return r.text(); }).then(function (css) {
    var blocks = css.split(/(?=\/\*)/).filter(function (b) { return /^\/\* latin \*\//.test(b); });
    return Promise.all(blocks.map(function (b) {
      var m = b.match(/url\((https:[^)]+)\)/); if (!m) return b;
      return fetch(m[1]).then(function (r) { return r.blob(); }).then(function (blob) {
        return new Promise(function (res) { var fr = new FileReader(); fr.onload = function () { res(b.replace(m[1], fr.result)); }; fr.readAsDataURL(blob); });
      });
    })).then(function (a) { return a.join("\n"); });
  }).catch(function () { fontEmbed = null; return ""; });

}

function understand(text) {
  var found = parseBrief(state.type, text), f = state.fields[state.type], got = [];
  Object.keys(found).forEach(function (k) { if (k !== "_unplaced" && found[k] && TYPES[state.type].fields.some(function (x) { return x.k === k; })) { f[k] = found[k]; got.push(k); } });
  var extra = found._unplaced && found._unplaced.length ? " I couldn't place <i>" + esc(found._unplaced.join(", ")) + "</i>, so I left it out." : "";
  showFieldCard("Here's what I understood." + extra + " Check it and fill in anything missing.", state.generated ? "Update designs" : "Generate designs", got);
}
function showFieldCard(intro, buttonLabel, foundKeys) {
  var t = TYPES[state.type], f = state.fields[state.type] || (state.fields[state.type] = {}), stamp = Date.now();
  var parsed = foundKeys !== undefined; foundKeys = foundKeys || [];
  var form = h('<form class="card-form" novalidate></form>');
  t.fields.forEach(function (fd) {
    var id = "fc-" + fd.k + "-" + stamp, has = !!f[fd.k];
    var tag = parsed ? (foundKeys.indexOf(fd.k) > -1 ? '<span class="found yes">found</span>' : has ? '' : '<span class="found no">not found</span>') : '';
    var control = fd.long ? '<textarea class="control" id="' + id + '" data-k="' + fd.k + '" placeholder="' + esc(fd.ph) + '" aria-describedby="' + id + '-e">' + esc(f[fd.k] || "") + '</textarea>'
      : '<input class="control" id="' + id + '" data-k="' + fd.k + '" placeholder="' + esc(fd.ph) + '" value="' + esc(f[fd.k] || "") + '" aria-describedby="' + id + '-e">';
    form.appendChild(h('<div class="field"><label class="field-label" for="' + id + '"><span>' + esc(fd.label) + (fd.req ? '' : ' <span class="opt">optional</span>') + '</span>' + tag + '</label>' + control +
      (fd.hint ? '<p class="hint">' + esc(fd.hint) + '</p>' : '') + '<p class="error" id="' + id + '-e" hidden>' + (fd.k === "date" ? "Add the date so it prints on every size." : "Deloo needs this one.") + '</p></div>'));
  });
  var btn = h('<button type="submit" class="btn btn-generate">' + esc(buttonLabel) + '</button>');
  form.appendChild(btn);
  form.addEventListener("submit", function (e) {
    e.preventDefault(); var firstBad = null;
    $$("[data-k]", form).forEach(function (inp) {
      var fd = t.fields.filter(function (x) { return x.k === inp.dataset.k; })[0], v = inp.value.trim();
      f[fd.k] = v;
      var bad = fd.req && !v; inp.setAttribute("aria-invalid", String(bad)); $(".error", inp.parentNode).hidden = !bad;
      if (bad && !firstBad) firstBad = inp;
    });
    if (firstBad) { firstBad.focus(); return; }
    btn.disabled = true; $$("input,textarea", form).forEach(function (i) { i.readOnly = true; });
    userSay(buttonLabel);
    if (state.generated) { refreshPoster(true, true); botSay("Updated. Every size uses the new details."); }
    else generate();
  });
  botSay(intro, null, function () { var first = $$("[data-k]", form).filter(function (i) { return !i.value; })[0]; if (first) first.focus({ preventScroll: true }); }, form);
}
function pickOptions(type) {
  var out = [];
  state.styles.concat(RECOMMEND[type], STYLE_ORDER).forEach(function (s) { if (out.indexOf(s) < 0 && out.length < 3) out.push(s); });
  return out;
}
function generate() {
  state.options = pickOptions(state.type); state.opt = 0; state.size = 0; state.generated = true;
  botSay("Making 3 options in your colours…", null, function () {
    drawCanvas();
    develop($("#canvas-frame"), false, function () {
      botSay("Your <b>" + esc(currentContent().headline) + "</b> designs are ready: 3 options, each in 4 sizes, in " + esc(state.org.name) + "'s colours. Switch with the tabs above the canvas, then download the one you like.", doneChips());
    });
  });
}
function doneChips() {
  return [
    { label: "Change a detail", fn: function () { showFieldCard("Edit anything here, then update your designs.", "Update designs"); } },
    { label: "Try another style", fn: styleChips },
    { label: "Change colours", fn: colourChips },
    { label: "Make something else", fn: askType }
  ];
}
function styleChips() { botSay("Pick a style for Option " + (state.opt + 1) + ":", STYLE_ORDER.map(function (s) { return { label: STYLES[s].name, fn: function () { setStyle(s); } }; })); }
function setStyle(s) {
  var at = state.options.indexOf(s);
  if (at > -1) state.opt = at; else state.options[state.opt] = s;
  drawCanvas(); refreshPoster(true, true);
  botSay("Option " + (state.opt + 1) + " is now <b>" + STYLES[s].name + "</b>.");
}
function colourChips() {
  var chips = PRESETS.map(function (p) { return { label: p.name, fn: function () { setPalette(p.p, p.a, "custom"); botSay("Switched to " + p.name.toLowerCase() + ". The layouts stay the same."); } }; });
  if (state.logo) chips.unshift({ label: "Match my logo", fn: function () { applyLogoPalette(true); } });
  botSay("Pick colours, or fine-tune them under <b>Your brand</b>. You can also type something like <i>make it green and gold</i>.", chips);
}

/* Free-form requests after generating. The mock handles a set of
   instructions; anything else gets steered back to the fields. */
var FIELD_WORDS = { date: "date", time: "time", venue: "venue", place: "venue", location: "venue", title: "title", name: "name", theme: "theme", speaker: "speaker", minister: "speaker", host: "host", headline: "headline", message: "message", quote: "quote", verse: "quote", reference: "reference", "dress code": "dress", dress: "dress", rsvp: "rsvp", day: "day", tagline: "tagline", from: "from", contact: "contact", occasion: "occasion", milestone: "milestone", "closing line": "cta" };
var TITLE_KEY = { event: "title", invite: "occasion", announce: "headline", birthday: "name", service: "headline", thanks: "headline", quote: "quote" };
function command(text) {
  var t = text.toLowerCase(), f = state.fields[state.type], keys = TYPES[state.type].fields.map(function (x) { return x.k; }), m;
  m = text.match(/(?:change|set|make|update|put)\s+(?:the\s+)?([a-z ]+?)\s+(?:to|as|into)\s+(.+)$/i) || text.match(/^(?:the\s+)?([a-z ]+?)\s+(?:is|should be)\s+(.+)$/i);
  if (m) {
    var word = m[1].trim().toLowerCase(), key = FIELD_WORDS[word];
    if ((key === "title" || key === "name" || key === "headline") && keys.indexOf(key) < 0) key = TITLE_KEY[state.type];
    if (key && keys.indexOf(key) > -1) {
      var v = m[2].trim().replace(/[.!]$/, "");
      if (key === "date") v = findDate(v) || v; if (key === "time") v = findTime(v) || v;
      f[key] = v; refreshPoster(true, true);
      botSay("Done. " + esc(fieldLabel(key)) + " is now <b>" + esc(v) + "</b>.");
      return;
    }
  }
  var colours = Object.keys(COLOR_WORDS).filter(function (w) { return new RegExp("\\b" + w + "\\b").test(t); });
  if (colours.length && /colou?r|make it|use|switch|try|palette|\band\b/.test(t)) {
    setPalette(COLOR_WORDS[colours[0]], colours[1] ? COLOR_WORDS[colours[1]] : null, "custom");
    botSay("Switched to " + esc(colours.slice(0, 2).join(" and ")) + ". The layout stays the same; only the colours changed.");
    return;
  }
  if (/logo/.test(t) && /colou?r|match/.test(t)) { if (state.logo) applyLogoPalette(true); else botSay("Add your logo under <b>Your brand</b> first, then I can match it."); return; }
  if (/grain|texture|noise/.test(t)) {
    state.grain = !/\b(off|remove|no|without|clean|smooth)\b/.test(t); $("#grain-toggle").checked = state.grain; refreshPoster(false);
    botSay(state.grain ? "Grain is back on." : "Grain is off. The designs are clean now."); return;
  }
  var style = STYLE_ORDER.filter(function (s) { return new RegExp("\\b" + STYLES[s].name.toLowerCase().split(" ")[0] + "\\b").test(t); })[0];
  if (style) { setStyle(style); return; }
  if (/another|different|other (style|option|look)|next option/.test(t)) { state.opt = (state.opt + 1) % state.options.length; drawCanvas(); refreshPoster(true, true); botSay("Here's Option " + (state.opt + 1) + ", <b>" + STYLES[state.options[state.opt]].name + "</b>."); return; }
  var sizeWords = [[/\b(story|stories|status)\b/, 1], [/\b(banner|twitter|linkedin)\b/, 2], [/\b(a5|handbill|print|flyer)\b/, 3], [/\b(post|square|instagram)\b/, 0]];
  for (var i = 0; i < sizeWords.length; i++) if (sizeWords[i][0].test(t) && /size|show|see|view|switch|want|need|open/.test(t)) { state.size = sizeWords[i][1]; drawCanvas(); botSay("Showing the " + esc(SIZES[state.size].long) + " size."); return; }
  if (/download|save|export/.test(t)) { download(); return; }
  if (/\b(new|another) design|something else|start over/.test(t)) { askType(); return; }
  var found = parseBrief(state.type, text), applied = [];
  Object.keys(found).forEach(function (k) { if (k !== "_unplaced" && keys.indexOf(k) > -1 && found[k] && k !== TITLE_KEY[state.type]) { f[k] = found[k]; applied.push(fieldLabel(k).toLowerCase() + " → " + found[k]); } });
  if (applied.length) { refreshPoster(true, true); botSay("Updated " + esc(applied.join(", ")) + "."); return; }
  botSay("I can't do that one yet in this preview. I can change details, colours, style, size or grain. Try <i>change the date to 5 Oct</i>, <i>make it green and gold</i> or <i>try the receipt style</i>, or use these:", doneChips());
}

/* =====================================================================
   DEMO, GALLERY
   ===================================================================== */
function testLogo() {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#1B2A4A"/><circle cx="50" cy="50" r="41" fill="none" stroke="#E8B84A" stroke-width="2"/><text x="50" y="61" text-anchor="middle" font-family="Georgia, serif" font-size="32" font-weight="700" fill="#E8B84A">GH</text></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}
function loadDemo() {
  state = freshState(); chatQueue = Promise.resolve();
  state.org = { name: "Grace Harbour Chapel", type: "church", typeOther: "", structure: "branches" };
  state.types = ["event", "invite", "quote", "service", "thanks"]; state.styles = ["block", "badge", "ticket"];
  state.logo = testLogo(); state.logoStepDone = true; state.palette = buildPalette("#1B2A4A", "#E8B84A"); state.paletteSource = "logo";
  state.type = "event"; state.fields.event = Object.assign({}, SAMPLES.event);
  state.options = pickOptions("event"); state.generated = true; state.chatStarted = true;
  renderDashboard();
  botSay("Demo loaded: <b>Grace Harbour Chapel</b> (test data), with an event flyer already made. Try the tabs, or ask for a change like <i>make it red and cream</i>.", doneChips());
}
function renderGallery() {
  state.view = "gallery";
  var type = state.type || "event", fields = state.type ? state.fields[type] : SAMPLES[type];
  var org = state.org.name || "Grace Harbour Chapel", content = toContent(type, fields, org);
  app.innerHTML = '<div class="gallery"><div class="ob-actions"><p class="wordmark">deloo<span class="dot">.</span></p><span class="badge">Style gallery · ' + esc(TYPES[type].label) + '</span><span class="spacer"></span>' +
    '<button type="button" class="btn btn-secondary btn-sm" id="g-back">Back to dashboard</button></div><div id="g-rows"></div></div>';
  $("#g-back").addEventListener("click", function () { renderDashboard(); });
  var rows = $("#g-rows");
  STYLE_ORDER.forEach(function (sk) {
    var sec = h('<section><h2>' + STYLES[sk].name + '</h2><div class="row"></div></section>'); rows.appendChild(sec);
    SIZES.forEach(function (sz) {
      var cell = h('<div><div class="frame"><div class="poster"></div></div><p class="hint">' + sz.name + '</p></div>'); $(".row", sec).appendChild(cell);
      var poster = $(".poster", cell); renderPoster(poster, sk, sz, content, { org: org, logo: state.logo || testLogo() }, state.palette, state.grain);
      var w = cell.clientWidth || 240; scaleInto($(".frame", cell), poster, sz, w, w * 1.25);
    });
  });
}

/* =====================================================================
   BOOT. Load poster fonts first so text fitting measures real glyphs.
   #demo opens the demo, #gallery shows every style, #selftest checks export.
   ===================================================================== */
var FONT_PROBES = ["900 40px Archivo", "800 40px Archivo", "expanded 900 40px Archivo", "condensed 800 40px Archivo", "40px Anton", "400 40px 'Space Mono'", "700 40px 'Space Mono'",
  "40px Yellowtail", "40px 'Mrs Saint Delafield'", "40px 'Instrument Serif'", "800 40px 'Inter Tight'", "600 40px 'Inter Tight'", "700 40px Caveat"];
var fontsReady = document.fonts && document.fonts.load
  ? Promise.all(FONT_PROBES.map(function (f) { return document.fonts.load(f).catch(function () {}); })).then(function () { return document.fonts.ready; })
  : Promise.resolve();
Promise.race([fontsReady, new Promise(function (r) { setTimeout(r, 4000); })]).then(function () {
  getFontEmbedCSS();
  var hash = location.hash.replace("#", "");
  if (hash === "demo") loadDemo();
  else if (hash === "gallery") { loadDemo(); renderGallery(); }
  else if (hash === "selftest") {
    loadDemo();
    var content = currentContent(), results = [], host = document.createElement("div");
    host.style.cssText = "position:absolute;left:-99999px;top:0"; document.body.appendChild(host);
    var jobs = []; STYLE_ORDER.forEach(function (sk) { SIZES.forEach(function (sz) { jobs.push([sk, sz]); }); });
    jobs.reduce(function (p, j) {
      return p.then(function () {
        var el = document.createElement("div"); host.appendChild(el);
        renderPoster(el, j[0], j[1], content, ctx(), state.palette, state.grain);
        return toPng(el, j[1])
          .then(function (u) { results.push(j[0] + "/" + j[1].key + ":" + (u.length > 5000 ? "ok" : "small")); }, function () { results.push(j[0] + "/" + j[1].key + ":ERR"); })
          .then(function () { el.remove(); });
      });
    }, Promise.resolve()).then(function () { document.body.setAttribute("data-selftest", results.join(" ")); });
  }
  else renderOnboarding();
});
})();
</script>
