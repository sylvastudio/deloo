# Netlify site for the web build of the renter app: https://app.deloo.space
# (separate from the Next.js site, whose config is ../netlify.toml).
#
# Site settings: Base directory = mobile (so this file is used), everything else comes from here.
# Environment variables to set in THIS site's settings (public values, inlined into the JS at build):
#   EXPO_PUBLIC_SUPABASE_URL
#   EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
# EXPO_PUBLIC_API_URL is set below, not in the UI: values here win over the UI, so a development
# address copied from mobile/.env (http://192.168…) can't reach the live app again.
[build]
  base = "mobile"
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_PUBLIC_API_URL = "https://deloo.space"
  # The publishable Supabase key is meant to ship in the browser bundle.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY,EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_API_URL"

# Single-page app (app.json web.output "single"): every path is the same index.html and expo-router
# picks the screen from the URL, so /item/<id>, /booking/<id>, /pay?reference=… survive a refresh.
# Files that exist (JS, icons, manifest) are served first; Netlify only rewrites misses.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed bundles never change; index.html is revalidated each time (Netlify's default).
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
