# Netlify build for the Next.js app. Env vars (Supabase, AI keys) are set in the Netlify UI, not here.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 needs Node >= 20.9; matches local dev.
  NODE_VERSION = "22"
  # Turbopack's build cache snapshots server env vars (incl. secret keys). It is kept privately
  # between builds and never published, so don't fail secrets scanning on it. Published output
  # (.next/static, functions) is still scanned.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Our own functions next to the Next.js ones. netlify/functions/notify-cron.mts is a scheduled function
# (every 15 minutes, published deploy only) that calls /api/cron/notify to send booking messages.
# Env vars it needs, set in the Netlify UI (scopes: Builds + Functions):
#   RESEND_API_KEY  (secret) Resend API key with sending access to deloo.space
#   CRON_SECRET     (secret) any long random string; the function sends it, the route checks it
#   NOTIFY_FROM     (optional) defaults to "Deloo <hello@deloo.space>"
[functions]
  directory = "netlify/functions"
